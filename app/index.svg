<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
	<foreignObject width="100%" height="100%">
		<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
			<head>
			<script>/*<![CDATA[*/
				window.__vfail = [];
				window.__vnote = function (s) { window.__vfail.push(s); };
			/*]]>*/</script>
			<script src="dom-shim.js" onerror="__vnote('dom-shim.js')"></script>

			<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<title>Vector</title>
		<meta name="theme-color" content="#100a24" />

		<link rel="icon" type="image/svg+xml" href="favicon.svg" />
			<link rel="stylesheet" href="index.css" />
			<style>/*<![CDATA[*/
				html, body { width: 100%; height: 100%; }
				foreignObject { overflow: visible; }
				#sj-frame { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; background: #0b0817; z-index: 100; }

				/* The aurora canvas (#bg) sits at z-index:-1. In an HTML document the
				   body background propagates to the viewport and is painted BEFORE
				   negative z-index children, so the canvas shows through it. Inside
				   <foreignObject> the <html> element is not the document root, so that
				   background paints as an ordinary block background -- which comes
				   AFTER negative z-index children in the painting order and buries the
				   aurora. Paint the base gradient on the svg root instead (:root, the
				   stacking context, painted first) and leave html/body transparent. */
				:root {
					background:
						radial-gradient(1100px 620px at 12% -12%, rgba(100, 149, 237, 0.22), transparent 60%),
						radial-gradient(1000px 720px at 92% 112%, rgba(124, 58, 237, 0.28), transparent 62%),
						linear-gradient(158deg, #140d2c 0%, #180f31 44%, #0b0817 100%);
					background-attachment: fixed;
				}
				html, body { background: transparent; }
			/*]]>*/</style>
			</head>

			<body>
			<div id="boot-warn" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b0817;color:#e9e4ff;font:16px/1.6 system-ui,sans-serif;text-align:center">
				<div>
					<strong style="display:block;font-size:20px;margin-bottom:8px">Vector couldn&#8217;t start</strong>
					<span id="boot-detail">The page&#8217;s scripts did not run.</span><br />
					<span style="opacity:0.7;font-size:14px">If this is a CDN, try a URL pinned to a commit rather than a branch &#8212; a half-updated cache serves a new page with old scripts.</span>
				</div>
			</div>

		<canvas id="bg" aria-hidden="true"></canvas>

		<main class="hero">
			<div class="mark" title="Vector">
				<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="72" height="72" aria-hidden="true">
					<defs>
						<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
							<stop offset="0" stop-color="#a78bfa" />
							<stop offset="1" stop-color="#6495ed" />
						</linearGradient>
					</defs>
					<rect x="6" y="6" width="84" height="84" rx="24" fill="url(#g)" />
					<g
						stroke="#ffffff"
						stroke-width="10"
						stroke-linecap="round"
						stroke-linejoin="round"
						fill="none"
					>
						<line x1="32" y1="64" x2="64" y2="32" />
						<polyline points="44,32 64,32 64,52" />
					</g>
				</svg>
			</div>

			<h1 class="wordmark">vector</h1>
			<p class="tagline">A straight line to the open web.</p>

			<form id="sj-form" class="search">
				<input
					id="sj-search-engine"
					value="https://www.google.com/search?q=%s"
					type="hidden"
				/>
				<svg xmlns="http://www.w3.org/2000/svg"
					class="search-icon"
					viewBox="0 0 24 24"
					width="20"
					height="20"
					aria-hidden="true"
				>
					<circle
						cx="11"
						cy="11"
						r="7"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
					/>
					<line
						x1="16.5"
						y1="16.5"
						x2="21"
						y2="21"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
					/>
				</svg>
				<input
					id="sj-address"
					type="text"
					placeholder="Search or enter a URL"
					autocomplete="off"
					autocapitalize="off"
					spellcheck="false"
				/>
				<kbd class="enter-hint">↵</kbd>
			</form>

			<button type="button" id="open-games" class="games-btn">
				<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
					<rect
						x="3"
						y="6"
						width="18"
						height="12"
						rx="4"
						fill="none"
						stroke="currentColor"
						stroke-width="1.8"
					/>
					<line
						x1="7"
						y1="12"
						x2="10"
						y2="12"
						stroke="currentColor"
						stroke-width="1.8"
						stroke-linecap="round"
					/>
					<line
						x1="8.5"
						y1="10.5"
						x2="8.5"
						y2="13.5"
						stroke="currentColor"
						stroke-width="1.8"
						stroke-linecap="round"
					/>
					<circle cx="15.5" cy="11" r="1.2" fill="currentColor" />
					<circle cx="17.5" cy="13" r="1.2" fill="currentColor" />
				</svg>
				Games
			</button>

			<div class="status">
				<p id="sj-error"></p>
				<pre id="sj-error-code"></pre>
			</div>
		</main>

		<footer>
			<span class="pulse" aria-hidden="true"></span>
			<span class="muted">running on your own Cloudflare edge</span>
			<a href="credits.html">credits</a>
		</footer>

		<!-- Games panel -->
		<div id="games" class="panel" aria-hidden="true">
			<div class="panel-head">
				<h2>Games</h2>
				<button class="vbtn" id="games-close" title="Close">&#215;</button>
			</div>
			<div id="games-grid" class="games-grid"></div>
			<p id="games-empty" class="games-empty" hidden="hidden">
				No games yet. Drop <code>.html</code> files into
				<code>public/games/</code> and redeploy — they'll show up here
				automatically.
			</p>
		</div>

		<!-- Fullscreen game player -->
		<div id="game-view" aria-hidden="true">
			<div class="gv-bar">
				<button class="vbtn" id="gv-back" title="Back">&#8249;</button>
				<span id="gv-title" class="gv-title"></span>
				<button class="vbtn" id="gv-fav" title="Favorite">&#9734;</button>
				<a class="vbtn" id="gv-dl" title="Download HTML" download="download">&#10515;</a>
			</div>
			<iframe id="gv-frame" title="Game"></iframe>
		</div>

		<!-- In-proxy browser shell: shown once you open a page -->
		<div id="vbar" aria-hidden="true">
			<div class="vrow vrow-tabs">
				<span class="vbrand" title="Vector" aria-hidden="true">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="22" height="22">
						<defs>
							<linearGradient id="gb" x1="0" y1="0" x2="1" y2="1">
								<stop offset="0" stop-color="#a78bfa" />
								<stop offset="1" stop-color="#6495ed" />
							</linearGradient>
						</defs>
						<rect x="6" y="6" width="84" height="84" rx="26" fill="url(#gb)" />
						<g
							stroke="#fff"
							stroke-width="11"
							stroke-linecap="round"
							stroke-linejoin="round"
							fill="none"
						>
							<line x1="32" y1="64" x2="64" y2="32" />
							<polyline points="44,32 64,32 64,52" />
						</g>
					</svg>
				</span>
				<div class="vtabs" id="vtabs"></div>
				<button class="vbtn vnew" id="vnewtab" title="New tab">+</button>
			</div>
			<div class="vrow vrow-tools">
				<button class="vbtn" id="vback" title="Back" aria-label="Back">
					‹
				</button>
				<button class="vbtn" id="vfwd" title="Forward" aria-label="Forward">
					›
				</button>
				<button class="vbtn" id="vreload" title="Reload" aria-label="Reload">
					⟳
				</button>
				<form class="vurl" id="vurlform">
					<input
						id="vurl"
						type="text"
						placeholder="Search or enter a URL"
						autocomplete="off"
						autocapitalize="off"
						spellcheck="false"
					/>
				</form>
			</div>
		</div>
		<div id="vframes" aria-hidden="true"></div>
			<script src="../cdn/scram/scramjet.all.js" onerror="__vnote('scramjet.all.js')"></script>
			<script src="../cdn/baremux/index.js" onerror="__vnote('index.js')"></script>
			<script src="wisp-config.js" onerror="__vnote('wisp-config.js')"></script>
			<script src="register-sw.js" onerror="__vnote('register-sw.js')"></script>
			<script src="search.js" onerror="__vnote('search.js')"></script>
			<script src="app.js" onerror="__vnote('app.js')"></script>
			<script src="bg.js" onerror="__vnote('bg.js')"></script>
			<script src="games.js" onerror="__vnote('games.js')"></script>
			<script>/*<![CDATA[*/
				(function () {
					var fo = document.querySelector("foreignObject");
					var root = fo && fo.firstElementChild;
					var warn = root && root.querySelector('[id="boot-warn"]');
					if (!warn || warn.style.display === "none") return;
					var detail = root.querySelector('[id="boot-detail"]');
					if (!detail) return;
					var failed = window.__vfail || [];
					detail.textContent = failed.length
						? "These files did not load: " + failed.join(", ")
						: "Scripts loaded but app.js did not start it. Check the console for an error.";
				})();
			/*]]>*/</script>
			</body>
		</html>
	</foreignObject>
</svg>
