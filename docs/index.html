<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<title>Vector</title>
		<meta name="theme-color" content="#100a24" />

		<link rel="icon" type="image/svg+xml" href="favicon.svg" />
		<link rel="stylesheet" href="index.css" />
		<script src="games.js" defer></script>
		<script src="bg.js" defer></script>
	</head>

	<body>
		<canvas id="bg" aria-hidden="true"></canvas>

		<main class="hero">
			<div class="mark" title="Vector">
				<svg viewBox="0 0 96 96" width="72" height="72" aria-hidden="true">
					<defs>
						<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
							<stop offset="0" stop-color="#a78bfa" />
							<stop offset="1" stop-color="#6495ed" />
						</linearGradient>
					</defs>
					<rect x="6" y="6" width="84" height="84" rx="24" fill="url(#g)" />
					<g
						stroke="#ffffff"
						stroke-width="10"
						stroke-linecap="round"
						stroke-linejoin="round"
						fill="none"
					>
						<line x1="32" y1="64" x2="64" y2="32" />
						<polyline points="44,32 64,32 64,52" />
					</g>
				</svg>
			</div>

			<h1 class="wordmark">vector</h1>
			<p class="tagline">Pick a game. Play anywhere.</p>

			<button type="button" id="open-games" class="games-btn">
				<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
					<rect
						x="3"
						y="6"
						width="18"
						height="12"
						rx="4"
						fill="none"
						stroke="currentColor"
						stroke-width="1.8"
					/>
					<line
						x1="7"
						y1="12"
						x2="10"
						y2="12"
						stroke="currentColor"
						stroke-width="1.8"
						stroke-linecap="round"
					/>
					<line
						x1="8.5"
						y1="10.5"
						x2="8.5"
						y2="13.5"
						stroke="currentColor"
						stroke-width="1.8"
						stroke-linecap="round"
					/>
					<circle cx="15.5" cy="11" r="1.2" fill="currentColor" />
					<circle cx="17.5" cy="13" r="1.2" fill="currentColor" />
				</svg>
				Games
			</button>
		</main>

		<footer>
			<span class="pulse" aria-hidden="true"></span>
			<span class="muted">served from the edge</span>
			<a href="credits.html">credits</a>
		</footer>

		<!-- Games panel -->
		<div id="games" class="panel" aria-hidden="true">
			<div class="panel-head">
				<h2>Games</h2>
				<button class="vbtn" id="games-close" title="Close">&times;</button>
			</div>
			<div id="games-grid" class="games-grid"></div>
			<p id="games-empty" class="games-empty" hidden>No games yet.</p>
		</div>

		<!-- Fullscreen game player -->
		<div id="game-view" aria-hidden="true">
			<div class="gv-bar">
				<button class="vbtn" id="gv-back" title="Back">&lsaquo;</button>
				<span id="gv-title" class="gv-title"></span>
				<button class="vbtn" id="gv-fav" title="Favorite">&#9734;</button>
				<a class="vbtn" id="gv-dl" title="Download HTML" download>&#10515;</a>
			</div>
			<iframe id="gv-frame" title="Game"></iframe>
		</div>
	</body>
</html>
