name = "vector-site"
main = "src/index.js"
compatibility_date = "2025-01-01"
account_id = "a2f2f2d84abce47bdc065c0f8048f025"

# Every hostname below is served by this one Worker from the same dist/ build,
# so each is a fully working, independent link to the app. They are all
# custom_domain routes: on deploy, Cloudflare auto-creates the DNS record for
# each on the zilkcz.com zone, so there is nothing to wire up by hand.
#
# To mint another link: add one line here, then run `npm run deploy:site`.
# To retire one that got blocked: delete its line, redeploy, and remove its
# DNS record in the Cloudflare dashboard. Prefer plain, boring hostnames --
# a filter categorises by name, so "docs"/"read"/"go" outlast "proxy"/"unblock".
#
# To add a SECOND domain as a whole-zone fallback (survives a block of every
# *.zilkcz.com at once): add that domain to this same Cloudflare account as a
# zone, then add its subdomains here exactly like the ones below, e.g.
#   { pattern = "go.example.net", custom_domain = true },
# and redeploy. Same Worker, same build -- nothing else changes.
routes = [
  { pattern = "v.zilkcz.com", custom_domain = true },
  { pattern = "go.zilkcz.com", custom_domain = true },
  { pattern = "read.zilkcz.com", custom_domain = true },
  { pattern = "docs.zilkcz.com", custom_domain = true },
  { pattern = "study.zilkcz.com", custom_domain = true },
  { pattern = "notes.zilkcz.com", custom_domain = true },
]

# Zone-independent fallback. Cloudflare also serves this Worker at
# vector-site.<your-account-subdomain>.workers.dev, on Cloudflare's own domain.
# A block of the whole zilkcz.com zone does not touch it, because it is not
# zilkcz.com. `npx wrangler deploy` prints the exact URL. (A filter may still
# block workers.dev by category, but it is a genuinely separate domain and
# costs nothing, so it is worth having on as a backstop.)
workers_dev = true

# Serve the built static site (dist/) and let the worker wrap every response
# with the cross-origin-isolation headers the proxy needs.
assets = { directory = "../dist", binding = "ASSETS", run_worker_first = true }
